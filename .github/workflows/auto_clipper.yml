name: Kantor AI Clipper Otomatis

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jalankan-kantor-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Siapkan Node.js untuk yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instal FFmpeg & AI Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U google-genai "yt-dlp[default]" gdown openai-whisper requests
          
      - name: Jalankan Kantor AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python kantor_ai.py
